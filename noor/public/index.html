<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نور ملهم</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2b25;--mu:#66756e;--pr:#0f7a5a;--ac:#c9922e;--bd:#e3dfd2}
@media(prefers-color-scheme:dark){:root{--bg:#10181a;--card:#182326;--tx:#e8efe9;--mu:#98a8a0;--pr:#37b88f;--ac:#e0b050;--bd:#2a3a3d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--pr);color:#fff;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;flex:1}.pts{background:rgba(255,255,255,.22);padding:1px 12px;border-radius:99px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:6px 14px;border-radius:99px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff}
main{max-width:760px;margin:auto;padding:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}.ay{font-size:21px;line-height:2.1;color:var(--pr)}
.btn{border:0;background:var(--pr);color:#fff;padding:7px 14px;border-radius:10px;font:inherit;cursor:pointer;margin:2px}
.btn.s{background:var(--bd);color:var(--tx)}.btn.g{background:var(--ac)}
input,textarea,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.opt{display:block;width:100%;text-align:right;margin:5px 0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.ok{background:#1e9e6a!important;color:#fff}.no{background:#c0392b!important;color:#fff}.hid{opacity:.25;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bd{background:var(--ac);color:#fff;border-radius:99px;padding:0 9px;font-size:12px;margin:0 2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-left:5px}.dot.on{background:#2ecc71}
.ad{border:1px dashed var(--ac);border-radius:12px;padding:12px;text-align:center;margin-bottom:10px;color:var(--mu)}
img.p,video.p{max-width:100%;border-radius:10px;margin-top:6px}
a.u{color:var(--pr);cursor:pointer;font-weight:bold}
#calls{position:fixed;bottom:10px;left:10px;display:none;gap:6px;z-index:9}#calls video{width:150px;border-radius:10px;background:#000}
</style>
</head>
<body>
<header><h1 id="logo">☪ نور ملهم</h1><span class="pts" id="pts"></span><button class="btn s" id="out" style="display:none" onclick="logout()">خروج</button></header>
<nav id="nav"></nav>
<main id="v"></main>
<div id="calls"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><button class="btn g" onclick="hang()">إنهاء</button></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,FacebookAuthProvider,signInWithPopup,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,addDoc,collection,query,orderBy,limit,onSnapshot,updateDoc,deleteDoc,arrayUnion,arrayRemove,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

// ====== ضع إعدادات مشروعك هنا (Firebase Console > Project settings) ======
const cfg={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"000000000000",appId:"YOUR_APP_ID"};

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),st=getStorage(app),fn=getFunctions(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F=n=>httpsCallable(fn,n);
let me=null,adm=false,tab="feed",subs=[],ads=[],meDoc={},users={},pc=null,stream=null;
const sub=u=>subs.push(u),clear=()=>{subs.forEach(u=>u());subs=[]};
const badges=u=>(u.verified||u.points>=10000?'<span class="bd">✔ موثّق</span>':"")+(u.points>=100?'<span class="bd">⭐ متفاعل</span>':"")+(u.isAdmin?'<span class="bd">👑 المالك</span>':"");
const adHtml=()=>ads.length?`<div class="ad">${esc(ads[Math.floor(Math.random()*ads.length)].text)}</div>`:"";
const online=u=>Date.now()-(u.lastSeen||0)<70000;
const tabs=[["feed","الرئيسية"],["content","القرآن والقصص"],["quiz","المسابقات"],["chat","الرسائل"],["notifs","الإشعارات"],["board","المتصدرون"],["me","ملفي"]];

// ---------- الدخول ----------
function authView(){
 $("#nav").innerHTML="";$("#out").style.display="none";
 $("#v").innerHTML=`<div class="c"><h3>أهلاً بك في نور ملهم</h3>
 <input id="nm" placeholder="الاسم (للتسجيل الجديد)"><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور">
 <button class="btn" onclick="login()">دخول</button><button class="btn s" onclick="reg()">حساب جديد</button><button class="btn g" onclick="fb()">الدخول بفيسبوك</button><p class="mu" id="er"></p></div>`}
const err=e=>{$("#er").textContent=e.message||e};
window.login=()=>signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(err);
window.reg=async()=>{try{sessionStorage.nm=$("#nm").value;await createUserWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}catch(e){err(e)}};
window.fb=()=>signInWithPopup(auth,new FacebookAuthProvider()).catch(err);
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 clear();me=u;if(!u){authView();return}
 const r=doc(db,"users",u.uid);
 if(!(await getDoc(r)).exists())await setDoc(r,{name:sessionStorage.nm||u.displayName||u.email.split("@")[0],points:0,correct:0,verified:false,createdAt:Date.now(),lastSeen:Date.now()});
 adm=(await getDoc(doc(db,"admins",u.uid))).exists();
 sub(onSnapshot(r,s=>{meDoc=s.data()||{};$("#pts").textContent="💎 "+(meDoc.points||0)}));
 sub(onSnapshot(collection(db,"ads"),s=>ads=s.docs.map(d=>d.data())));
 sub(onSnapshot(collection(db,"users"),s=>{users={};s.docs.forEach(d=>users[d.id]={id:d.id,...d.data()})}));
 const beat=()=>updateDoc(r,{lastSeen:Date.now()}).catch(()=>{});beat();setInterval(beat,30000);
 // مكالمات واردة
 sub(onSnapshot(query(collection(db,"calls"),where("to","==",u.uid)),s=>s.docChanges().forEach(c=>{
   const d=c.doc.data();if(c.type=="added"&&d.offer&&!d.answer&&Date.now()-d.t<60000&&confirm("مكالمة فيديو واردة من "+(users[d.from]?.name||"مستخدم")+"، رد؟"))answer(c.doc)})));
 $("#out").style.display="";go("feed");
});
window.go=t=>{clear2();tab=t;draw()};
let vs=[];const clear2=()=>{vs.forEach(u=>u());vs=[]};
function draw(){
 const T=[...tabs];if(adm)T.push(["admin","لوحة المالك"]);
 $("#nav").innerHTML=T.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
 ({feed,content,quiz,chat,notifs,board,me:profile,admin})[tab]()}

// ---------- المنشورات ----------
function feed(){
 $("#v").innerHTML=adHtml()+`<div class="c"><textarea id="px" placeholder="شارك منشوراً..."></textarea><input id="pf" type="file" accept="image/*,video/*"><button class="btn" onclick="post()">نشر</button></div><div id="pl"></div>`;
 vs.push(onSnapshot(query(collection(db,"posts"),orderBy("t","desc"),limit(50)),s=>{
  const mid=Math.floor(Math.random()*Math.max(1,s.size));
  $("#pl").innerHTML=s.docs.map((d,i)=>{const p=d.data(),liked=(p.likedBy||[]).includes(me.uid),a=users[p.u]||{};
   return (i==mid&&i>0?adHtml():"")+`<div class="c"><div class="row"><a class="u" onclick="prof('${esc(p.u)}')"><span class="dot ${online(a)?"on":""}"></span>${esc(p.n)}</a><span class="mu">${new Date(p.t).toLocaleString("ar-EG")}</span></div><p>${esc(p.x)}</p>
   ${p.img?(p.vid?`<video class="p" controls src="${esc(p.img)}"></video>`:`<img class="p" src="${esc(p.img)}">`):""}
   <button class="btn s" onclick="like('${d.id}',${liked},'${esc(p.u)}')">${liked?"❤️":"🤍"} ${(p.likedBy||[]).length}</button>
   ${p.u==me.uid||adm?`<button class="btn s" onclick="edit('${d.id}')">تعديل</button><button class="btn s" onclick="del('${d.id}')">حذف</button>`:""}</div>`}).join("")}))}
window.post=async()=>{const x=$("#px").value.trim(),f=$("#pf").files[0];if(!x&&!f)return;let img="",vid=false;
 if(f){const r=ref(st,`posts/${me.uid}/${Date.now()}`);await uploadBytes(r,f);img=await getDownloadURL(r);vid=f.type.startsWith("video")}
 await addDoc(collection(db,"posts"),{u:me.uid,n:meDoc.name,x,img,vid,t:Date.now(),likedBy:[]});$("#px").value=""};
window.like=async(id,l,to)=>{await updateDoc(doc(db,"posts",id),{likedBy:l?arrayRemove(me.uid):arrayUnion(me.uid)});
 if(!l&&to!=me.uid)addDoc(collection(db,"users",to,"notifs"),{from:me.uid,text:`❤️ ${meDoc.name} أعجبه منشورك`,t:Date.now()})};
window.edit=async id=>{const x=prompt("تعديل المنشور");if(x)updateDoc(doc(db,"posts",id),{x})};
window.del=id=>confirm("حذف؟")&&deleteDoc(doc(db,"posts",id));

// ---------- المحتوى (قرآن / تفسير / قصص / فتاوى / أحاديث) ----------
const kinds={quran:"القرآن",tafsir:"التفسير",story:"قصص الأنبياء",fatwa:"فتاوى",hadith:"أحاديث"};
window.cf=k=>{window._k=k;content()};
function content(){const k=window._k||"quran";
 $("#v").innerHTML=adHtml()+`<div class="c">${Object.entries(kinds).map(([a,b])=>`<button class="btn ${a==k?"":"s"}" onclick="cf('${a}')">${b}</button>`).join("")}</div><div id="cl"></div>`;
 clear2();vs.push(onSnapshot(query(collection(db,"content"),where("kind","==",k)),s=>{
  $("#cl").innerHTML=s.docs.map(d=>d.data()).sort((a,b)=>(a.t||0)-(b.t||0)).map(c=>`<div class="c"><h3>${esc(c.title)}</h3><div class="${c.kind=="quran"?"ay":""}">${esc(c.text)}</div>${c.audio?`<audio controls src="${esc(c.audio)}"></audio>`:""}${c.video?`<video class="p" controls src="${esc(c.video)}"></video>`:""}</div>`).join("")||'<p class="mu">لا يوجد محتوى بعد.</p>'}))}

// ---------- المسابقات ----------
let qs=[],qi=0,answered=false;
async function quiz(){qs=(await getDocs(collection(db,"questions"))).docs.map(d=>({id:d.id,...d.data()}));qi=0;qshow()}
function qshow(){const q=qs[qi];if(!q){$("#v").innerHTML='<div class="c">لا توجد أسئلة. أضفها من لوحة المالك.</div>';return}
 answered=false;$("#v").innerHTML=adHtml()+`<div class="c"><div class="mu">سؤال ${qi+1} من ${qs.length} · ${esc(q.type||"")}</div><h3>${esc(q.q)}</h3>`+
 q.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="ans(${i})">${esc(o)}</button>`).join("")+
 `<button class="btn g" onclick="hint()">💡 مساعدة (-5)</button><button class="btn s" onclick="nextQ()">التالي</button></div>`}
window.ans=async i=>{if(answered)return;answered=true;try{const r=(await F("answer")({qid:qs[qi].id,choice:i})).data;
 $("#o"+r.correct).classList.add("ok");if(!r.ok)$("#o"+i).classList.add("no")}catch(e){alert(e.message)}};
window.hint=async()=>{if(answered)return;try{const r=(await F("hint")({qid:qs[qi].id})).data;r.hide.forEach(i=>$("#o"+i).classList.add("hid"))}catch(e){alert(e.message)}};
window.nextQ=()=>{qi=(qi+1)%qs.length;qshow()};

// ---------- الرسائل والمكالمات ----------
function chat(){const L=Object.values(users).filter(u=>u.id!=me.uid);
 $("#v").innerHTML=`<div class="c"><h3>الأشخاص</h3>${L.map(u=>`<div class="row"><span><span class="dot ${online(u)?"on":""}"></span>${esc(u.name)} ${badges(u)}</span><span><button class="btn s" onclick="room('${u.id}')">💬</button><button class="btn s" onclick="callTo('${u.id}')">📹</button></span></div>`).join("")}</div><div id="room"></div>`}
const cid=o=>[me.uid,o].sort().join("_");
window.room=o=>{clear2();$("#room").innerHTML=`<div class="c"><h3>${esc(users[o]?.name)}</h3><div id="ms" style="max-height:300px;overflow:auto"></div><div class="row"><input id="mt" placeholder="اكتب رسالة"><button class="btn" onclick="send('${o}')">إرسال</button></div></div>`;
 vs.push(onSnapshot(query(collection(db,"chats",cid(o),"msgs"),orderBy("t")),s=>{$("#ms").innerHTML=s.docs.map(d=>{const m=d.data();return `<div style="text-align:${m.from==me.uid?"right":"left"}"><span class="bd" style="background:${m.from==me.uid?"var(--pr)":"var(--ac)"}">${esc(m.x)}</span></div>`}).join("");$("#ms").scrollTop=1e9}))};
window.send=async o=>{const x=$("#mt").value.trim();if(!x)return;await setDoc(doc(db,"chats",cid(o)),{a:me.uid,b:o,t:Date.now()},{merge:true});
 await addDoc(collection(db,"chats",cid(o),"msgs"),{from:me.uid,x,t:Date.now()});$("#mt").value="";
 addDoc(collection(db,"users",o,"notifs"),{from:me.uid,text:`✉️ رسالة جديدة من ${meDoc.name}`,t:Date.now()})};

// ---------- مكالمات فيديو (WebRTC) ----------
const ice={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
async function media(){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$("#lv").srcObject=stream;$("#calls").style.display="flex";
 pc=new RTCPeerConnection(ice);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>$("#rv").srcObject=e.streams[0]}
const addC=async c=>{for(let i=0;i<5;i++){try{await pc.addIceCandidate(c);return}catch(e){await new Promise(r=>setTimeout(r,400))}}};
window.callTo=async o=>{try{await media();const c=doc(collection(db,"calls"));
 pc.onicecandidate=e=>e.candidate&&addDoc(collection(c,"caller"),e.candidate.toJSON());
 const of=await pc.createOffer();await pc.setLocalDescription(of);await setDoc(c,{from:me.uid,to:o,t:Date.now(),offer:{type:of.type,sdp:of.sdp}});
 onSnapshot(c,async s=>{const d=s.data();if(d?.answer&&!pc.currentRemoteDescription){await pc.setRemoteDescription(d.answer);
  onSnapshot(collection(c,"callee"),q=>q.docChanges().forEach(x=>x.type=="added"&&addC(x.doc.data())))}})}catch(e){alert("تعذر بدء المكالمة: "+e.message);hang()}};
async function answer(snap){try{await media();const c=snap.ref,d=snap.data();
 pc.onicecandidate=e=>e.candidate&&addDoc(collection(c,"callee"),e.candidate.toJSON());
 await pc.setRemoteDescription(d.offer);const an=await pc.createAnswer();await pc.setLocalDescription(an);
 onSnapshot(collection(c,"caller"),q=>q.docChanges().forEach(x=>x.type=="added"&&addC(x.doc.data())));
 await updateDoc(c,{answer:{type:an.type,sdp:an.sdp}})}catch(e){alert(e.message);hang()}}
window.hang=()=>{pc&&pc.close();stream&&stream.getTracks().forEach(t=>t.stop());pc=stream=null;$("#calls").style.display="none"};

// ---------- الإشعارات / المتصدرون / الملف الشخصي ----------
function notifs(){$("#v").innerHTML='<div class="c" id="nl"></div>';
 vs.push(onSnapshot(query(collection(db,"users",me.uid,"notifs"),orderBy("t","desc"),limit(30)),s=>{$("#nl").innerHTML=s.docs.map(d=>`<div>🔔 ${esc(d.data().text)} <span class="mu">${new Date(d.data().t).toLocaleString("ar-EG")}</span></div>`).join("")||"لا إشعارات"}))}
function board(){const L=Object.values(users).sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,20);
 $("#v").innerHTML=`<div class="c"><h3>أفضل المتفاعلين</h3>${L.map((u,i)=>`<div class="row"><a class="u" onclick="prof('${u.id}')">${i+1}. ${esc(u.name)} ${badges(u)}</a><b>${u.points||0}</b></div>`).join("")}</div>`}
window.prof=id=>{const u=users[id];if(!u)return;$("#v").innerHTML=`<div class="c"><div class="row"><h3>${esc(u.name)} ${badges(u)}</h3><span><span class="dot ${online(u)?"on":""}"></span>${online(u)?"متصل":"غير متصل"}</span></div>${u.photo?`<img class="p" style="width:100px;height:100px;object-fit:cover;border-radius:50%" src="${esc(u.photo)}">`:""}<p>${esc(u.bio||"")}</p><p>النقاط: ${u.points||0} · إجابات صحيحة: ${u.correct||0}</p>${id!=me.uid?`<button class="btn" onclick="go('chat');setTimeout(()=>room('${id}'),300)">رسالة</button><button class="btn s" onclick="callTo('${id}')">📹 اتصال</button>`:""}</div>`};
function profile(){prof(me.uid);$("#v").innerHTML+=`<div class="c"><h3>تعديل ملفي</h3><input id="pn" value="${esc(meDoc.name)}"><textarea id="pb" placeholder="نبذة">${esc(meDoc.bio||"")}</textarea><input id="pp" type="file" accept="image/*"><button class="btn" onclick="saveP()">حفظ</button></div>`}
window.saveP=async()=>{const f=$("#pp").files[0],d={name:$("#pn").value,bio:$("#pb").value};if(f){const r=ref(st,"avatars/"+me.uid);await uploadBytes(r,f);d.photo=await getDownloadURL(r)}await updateDoc(doc(db,"users",me.uid),d);alert("تم الحفظ")};

// ---------- لوحة المالك ----------
function admin(){const L=Object.values(users);
 $("#v").innerHTML=`<div class="c"><h3>المستخدمون (${L.length})</h3>${L.map(u=>`<div class="row"><span><span class="dot ${online(u)?"on":""}"></span>${esc(u.name)} <span class="mu">${u.points||0} نقطة · ${u.correct||0} صحيحة · آخر ظهور ${u.lastSeen?new Date(u.lastSeen).toLocaleString("ar-EG"):"-"}</span></span><button class="btn s" onclick="ver('${u.id}',${!u.verified})">${u.verified?"إلغاء التوثيق":"توثيق"}</button></div>`).join("")}</div>
 <div class="c"><h3>إضافة محتوى</h3><select id="ak">${Object.entries(kinds).map(([a,b])=>`<option value="${a}">${b}</option>`).join("")}</select><input id="at" placeholder="العنوان"><textarea id="ax" placeholder="النص"></textarea><input id="av" placeholder="رابط فيديو (اختياري)"><input id="aa" placeholder="رابط صوت (اختياري)"><button class="btn" onclick="addC()">إضافة</button></div>
 <div class="c"><h3>إضافة سؤال</h3><select id="qt"><option>اختيار من متعدد</option><option>صح وخطأ</option></select><input id="qq" placeholder="السؤال"><input id="qo" placeholder="الخيارات مفصولة بـ ،"><input id="qc" type="number" placeholder="رقم الإجابة الصحيحة (يبدأ من 1)"><button class="btn" onclick="addQ()">إضافة</button></div>
 <div class="c"><h3>هدية نقاط</h3><select id="gu">${L.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select><input id="ga" type="number" placeholder="عدد النقاط"><button class="btn g" onclick="gift()">إرسال</button></div>
 <div class="c"><h3>إعلان جديد</h3><input id="ad" placeholder="نص الإعلان"><button class="btn" onclick="addAd()">إضافة</button></div>`}
window.ver=(id,v)=>updateDoc(doc(db,"users",id),{verified:v}).then(admin);
window.addC=async()=>{await addDoc(collection(db,"content"),{kind:$("#ak").value,title:$("#at").value,text:$("#ax").value,video:$("#av").value,audio:$("#aa").value,t:Date.now()});alert("تمت الإضافة")};
window.addQ=async()=>{const o=$("#qo").value.split(/[،,]/).map(s=>s.trim()).filter(Boolean),c=+$("#qc").value-1;if(!$("#qq").value||o.length<2||!(c>=0&&c<o.length))return alert("تحقق من البيانات");
 const r=await addDoc(collection(db,"questions"),{q:$("#qq").value,o,type:$("#qt").value});await setDoc(doc(db,"answers",r.id),{correct:c,points:10});alert("تمت الإضافة")};
window.gift=()=>F("gift")({uid:$("#gu").value,amount:+$("#ga").value}).then(()=>alert("تم الإرسال")).catch(e=>alert(e.message));
window.addAd=()=>addDoc(collection(db,"ads"),{text:$("#ad").value}).then(()=>alert("تمت الإضافة"));
</script>
</body>
</html>
